[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guideline-rsi-harness"
version = "0.1.0"
description = "Auditable experiments in annotation-policy adaptation"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "scikit-learn==1.8.0"]

[project.optional-dependencies]
reports = [
    "matplotlib==3.10.8",
    "pillow==12.3.0",
]

[project.scripts]
guideline-harness = "guideline_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
